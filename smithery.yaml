# Smithery configuration for SEFAZ DF: ISS
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_df_iss

name: sefaz_df_iss-mcp
displayName: "SEFAZ DF: ISS"
description: >
  SEFAZ DF: ISS, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_df_iss-mcp
repository: https://github.com/mcp-dir/sefaz_df_iss-mcp

tags:
  - sefaz_df_iss
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_df_iss

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_df_iss/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
